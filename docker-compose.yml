name: golden-base
# 一条命令起完整环境：MySQL + Redis + 后端 + nginx（静态前端 + /api 反代）
#
# - 密码全部 fail-closed：.env 未配置 MYSQL_ROOT_PASSWORD / MYSQL_PASSWORD /
#   REDIS_PASSWORD 时 compose 直接报错，不内置可猜的默认值。
# - backend 不对宿主暴露端口，只经 nginx 内网可达。
# - 复制 .env.example 为 .env 并填好值后再启动（见 README「快速开始」）。
services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中配置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-app_db}
      MYSQL_USER: ${DB_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中配置 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      # 仅在数据卷为空（全新部署）时执行，建表 + 会员档位种子
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+08:00
    networks:
      - app-net

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?请在 .env 中配置 REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis_data:/data
    networks:
      - app-net

  backend:
    build:
      context: .
      args:
        BASE_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      # 请求只经本编排的 nginx 进来，由 nginx 覆写 X-Real-IP / X-Forwarded-For
      TRUST_PROXY_HEADERS: "true"
      DB_HOST: mysql
      REDIS_HOST: redis
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      - mysql
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    networks:
      - app-net

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${HTTP_PORT:-8080}:80"
    environment:
      TZ: Asia/Shanghai
      # 与后端 PROXY_AUTH_SECRET 填同一个值，注入 X-Proxy-Auth 头，
      # 后端据此判定 X-Real-IP / X-Forwarded-For 可信（留空则跳过该校验）
      PROXY_AUTH_SECRET: ${PROXY_AUTH_SECRET:-}
      # 只替换这一个变量，nginx 内置变量（$host/$remote_addr/$scheme）原样保留
      NGINX_ENVSUBST_FILTER: PROXY_AUTH_SECRET
    volumes:
      - ./web:/usr/share/nginx/html:ro
      # 挂成 templates/*.template，容器启动时 envsubst 渲染后写入 conf.d/default.conf
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - backend
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
