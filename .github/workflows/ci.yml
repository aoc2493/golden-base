name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 静态检查 / 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ruff 静态检查
        run: ruff check .

      - name: 单元测试
        run: pytest --cov=app --cov-report=term --cov-fail-under=40

      - name: 类型检查（新增/资金关键模块）
        run: >-
          mypy --follow-imports=skip
          app/core/email.py
          app/core/services/credential.py
          app/core/services/refund_state.py
          app/core/api/common.py
          app/core/tasks/scheduler.py

      - name: 依赖漏洞扫描
        run: pip-audit -r requirements.txt

  mysql:
    name: 测试 / MySQL
    runs-on: ubuntu-latest
    # 资金链路里 CAS 更新、行锁、隔离级别、唯一约束的行为与 SQLite 不同，
    # 只跑内存库等于没验证生产形态。这里用真实 MySQL 8 跑同一套用例。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root-ci-password
          MYSQL_DATABASE: app_db
          MYSQL_USER: app_ci
          MYSQL_PASSWORD: app-ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-ci-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=24
    env:
      DB_TYPE: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: app_db
      DB_USER: app_ci
      DB_PASSWORD: app-ci-password
      # conftest 用 setdefault 填其余测试配置；这两个必须与内存库作业保持一致
      APP_ENV: development
      PAYMENT_MOCK: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: 单元测试（MySQL）
        run: pytest -q

  secret-scan:
    name: 密钥扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

      - name: 扫描全部历史
        run: /tmp/gitleaks detect --source . --redact -v --exit-code=2
