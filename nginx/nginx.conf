# ============================================================
# Golden Base nginx：静态前端 + /api 反代
# 本文件被挂载为 /etc/nginx/templates/default.conf.template，
# 容器启动时仅替换 ${PROXY_AUTH_SECRET}，其余 $变量原样保留。
# ============================================================

# 只有外层代理携带正确的共享密钥时，才采信其 X-Real-IP。这样在云 LB /
# 宿主 Nginx 后面限流仍按真实用户计数，同时直连用户无法伪造该头。
map "$http_x_proxy_auth" $client_ip {
    default $remote_addr;
    "${EDGE_PROXY_AUTH_SECRET}" $http_x_real_ip;
}

# 管理接口限流：每 IP 每分钟 20 个请求，突发 10
limit_req_zone $client_ip zone=admin_zone:10m rate=20r/m;
# 普通 API：每 IP 每秒 10 个请求，突发 20
limit_req_zone $client_ip zone=api_zone:10m rate=10r/s;

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css text/javascript
           application/javascript application/json application/xml text/xml
           image/svg+xml;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 8m;
    server_tokens off;

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; form-action 'self' https:; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;

    # 禁止下载备份 / 临时 / 源码 / 配置文件（web/ 是整目录只读挂载）
    location ~* \.(bak|old|orig|tmp|temp|log|sql|py|sh|md|env|ini|conf|ya?ml|map|save|swp)(\.|$) {
        return 404;
    }

    # 静态资源：协商缓存，发版即时生效
    location ~* ^/(?!api/).*\.(?:js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        add_header Cache-Control "no-cache";
        # add_header 在同一层级出现即不再继承上层，安全头必须就地重复声明
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; form-action 'self' https:; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # 管理接口：网关层再加一道限流（后端另有令牌失败锁定）
    location /api/admin/ {
        limit_req zone=admin_zone burst=10 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 反代共享密钥：后端 PROXY_AUTH_SECRET 非空时，只采纳带正确头的 X-Real-IP
        proxy_set_header X-Proxy-Auth "${PROXY_AUTH_SECRET}";
        proxy_read_timeout 60s;
    }

    # 普通后端 API
    location /api/ {
        limit_req zone=api_zone burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Proxy-Auth "${PROXY_AUTH_SECRET}";
        proxy_read_timeout 60s;
    }

    # 单页应用回退：带扩展名的路径按真实文件判定，不存在即 404
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; form-action 'self' https:; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
        if ($uri !~ "\.[A-Za-z0-9]{1,8}$") {
            rewrite ^ /index.html last;
        }
        try_files $uri $uri/ =404;
    }
}

# HTTPS：生产环境请在前置网关（云负载均衡 / 宿主 nginx / certbot）终结 TLS，
# 本容器只监听 80，由前置网关回源。需要本容器直接持证时，自行追加 443 server 块。
